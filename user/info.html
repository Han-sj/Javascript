<!DOCTYPE html>
<html xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
	<head>
		<meta charset="UTF-8">
		<title>사용자 정보</title>
		<script>

			document.addEventListener('DOMContentLoaded', async function(){

				// 사용자 정보 요청
				const response = await fetch('http://127.0.0.1:8080/ch09/user', {
					method: 'GET',
					credentials: 'include'
				});
				const data = await response.json();
				console.log(data);

				// 사용자 정보 출력
				const p = document.getElementsByTagName('p')[0];
				const spans = p.getElementsByTagName('span');

				spans[0].innerText = data.userid;
				spans[1].innerText = data.name;
				spans[2].innerText = data.birth;
				spans[3].innerText = data.age;
				spans[4].innerText = data.role;
				spans[5].innerText = data.rdate;

			 	const logout = document.getElementById('logout');

				logout.addEventListener('click', async function(e){
					e.preventDefault();

					// 로그아웃 요청
					try {
						const response = await fetch('http://127.0.0.1:8080/ch09/logout', {							
							credentials: 'include'
						});
						const data = await response.json();
						console.log(data);

						if(data.result){							
							location.href = './login.html?logout=success';
						}


					}catch(err){
						console.log(err);
					}

				});
			});
		</script>
	</head>
	<body>
		<h3>사용자 정보</h3>
		
		<a href="#" id="logout">로그아웃</a>
		
		<p>
			아이디 : <span></span><br>
			이름 : <span></span><br>
			생년월일 : <span>생년월일</span><br>
			나이 : <span>나이</span><br>
			회원등급 : <span></span><br>
			가입일 : <span></span><br>
		</p>
	</body>
</html>
